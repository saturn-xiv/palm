logging:
  file:
    name: "dahlia.log"
  logback:
    rollingpolicy:
      file-name-pattern: "%d{yyyy-MM-dd}-%i.log"
      max-file-size: "1GB"
      max-history: 1024
  level:
    root: "INFO"
    com.github.saturn_siv.palm: "DEBUG"
spring:
  datasource:
    hikari:
      connection-timeout: 5000
      minimum-pool-size: 8
      maximum-pool-size: 32
    url: "jdbc:postgresql://127.0.0.1:5432/dahlia_dev"
    username: "www"
    password: "change-me"
  flyway:
    locations: "classpath:/db/migrations/postgresql"