server:
  port: 8080
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    com.github.saturn_xiv.palm: DEBUG
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/hibiscus_dev
    username: "www"
    password: "change-me"
    driver-class-name: "org.postgresql.Driver"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  rabbitmq:
    host: "127.0.0.1"
    port: 5672
    username: "www"
    password: "change-me"
    virtual-host: "hibiscus.dev"
