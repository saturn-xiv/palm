spring:
  application:
    name: Hibiscus
  jpa:
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  task:
    execution:
      thread-name-prefix: "hibiscus-t-"
  liquibase:
    change-log: classpath:db/change-logs/master.xml
hibiscus:
  version: "@project.version@"
