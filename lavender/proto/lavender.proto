syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.lavender.v1";
option java_outer_classname = "LavenderProto";
option go_package = "./;v2";
option csharp_namespace = "Palm.Plugins.Lavender.Grpc";
package palm.lavender.v1;

message Empty {}
message Timestamp {
    int64 seconds = 1;
    int32 nanos = 2;
}
message Duration {
    int64 seconds = 1;
    int32 nanos = 2;
}

service Reporter {
  rpc Systemd(stream SystemdRequest) returns (SystemdResponse) {}
  rpc Kubernetes(stream KubernetesRequest) returns (KubernetesResponse) {}
  rpc Http(HttpRequest) returns (Empty) {}
}

message SystemdRequest {
    string host = 1;
    string unit = 2;
    uint32 priority = 3;
    string message = 4;
    Timestamp created_at = 9;
}
message SystemdResponse {
    uint32 chunk_count = 1;
}
message KubernetesRequest{
    string node = 1;
    string pod = 2;
    string container = 3;
    string message = 4;
    Timestamp created_at = 9;
}
message KubernetesResponse{
    uint32 chunk_count = 1;
}

message HttpRequest {
    message Item{
        string url = 1;
        uint32 status_code = 2;
        string content_type = 3;
        string body = 4;
        Duration elapsed = 8;
        Timestamp created_at = 9;
    }
    string host = 1;
    repeated Item items = 9;
}
message PostgreSql {
    string version = 1;
}
message MySql{
    string version = 1;
}
message Redis {
    string info = 1;
    optional string cluster = 2;
}
message Snmp {
    message Item{
        string oid = 1;
        oneof value{
            int64 i = 11;
            string s = 12;
            double d = 13;
        }
    }
    repeated Item items = 1;
}
message OpenSearch {
    string cluster_name = 1;
    string status = 2;
    bool timed_out = 3;
    uint32 number_of_nodes = 4;
    uint32 number_of_data_nodes = 5;
    bool discovered_master = 6;
    bool discovered_cluster_manager = 7;
    uint32 active_primary_shards = 8;
    uint32 active_shards = 9;
    uint32 relocating_shards = 10;
    uint32 initializing_shards = 11;
    uint32 unassigned_shards = 12;
    uint32 delayed_unassigned_shards = 13;
    uint32 number_of_pending_tasks = 14;
    uint32 number_of_in_flight_fetch = 15;
    uint32 task_max_waiting_in_queue_millis = 16;
    float active_shards_percent_as_number = 17;
}
