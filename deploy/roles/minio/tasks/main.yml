# https://min.io/open-source/download?platform=linux

- name: Download minio
  become: true
  ansible.builtin.get_url:
    url: "https://dl.min.io/server/minio/release/linux-{{ app_minio_arch }}/minio"
    dest: /usr/local/bin/minio
    mode: "0755"

- name: Create minio lib folder
  become: true
  ansible.builtin.file:
    path: "/var/lib/minio"
    owner: www-data
    group: www-data
    mode: "0750"
    state: directory

- name: Upload systemd minio.service
  become: true
  ansible.builtin.template:
    src: systemd.conf.j2
    dest: "/usr/lib/systemd/system/minio.service"
    mode: "0644"

- name: Upload systemd nginx.service
  become: true
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/sites-available/s3.{{ app_deploy_domain }}.conf"
    mode: "0644"

- name: Force systemd to reread configs
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable minio service
  become: true
  ansible.builtin.systemd:
    name: minio
    enabled: true
    masked: false
    state: "restarted"
