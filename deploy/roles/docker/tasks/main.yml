# https://docs.docker.com/engine/install/ubuntu/
# https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/

- name: Create apt keys folder
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download docker asc
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Upload docker.list
  become: true
  ansible.builtin.template:
    src: docker.list.j2
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"

- name: Download kubernetes-apt-keyring.gpg
  become: true
  ansible.builtin.shell:
    # yamllint disable rule:line-length
    cmd: set -o pipefail && curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ app_kubernetes_version }}/deb/Release.key | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    executable: /usr/bin/bash
  changed_when: false

- name: Upload kubernetes.list
  become: true
  ansible.builtin.template:
    src: kubernetes.list.j2
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: "0644"

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    # cache_valid_time: 3600

- name: Install docker packages
  become: true
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - kubelet
      - kubeadm
      - kubectl

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - docker
    append: true

- name: Change the default Docker storage location
  become: true
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"

- name: Change the default Docker cache location
  become: true
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: "^#root ="
    line: 'root = "/srv/.containerd"'
    backup: true

# https://kubernetes.io/docs/setup/production-environment/container-runtimes/#prerequisite-ipv4-forwarding-optional
- name: Enable IPv4 packet forwarding
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/101-k8s.conf
    line: "net.ipv4.ip_forward = 1"
    create: true
    mode: "0644"

- name: Restart containerd service
  become: true
  ansible.builtin.systemd_service:
    name: containerd.service
    state: restarted
    daemon_reload: true

- name: Restart docker service
  become: true
  ansible.builtin.systemd_service:
    name: docker.service
    state: restarted
    daemon_reload: true

- name: Restart kubelet service
  become: true
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
    daemon_reload: true
