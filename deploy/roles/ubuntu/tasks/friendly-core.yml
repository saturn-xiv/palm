- name: Disable autologin for ttyAMA0
  become: true
  ansible.builtin.replace:
    path: /etc/systemd/system/serial-getty@ttyAMA0.service.d/autologin.conf
    regexp: " --autologin pi "
    replace: " "
    backup: true

