scalar Time

schema {
  query: Query
  mutation: Mutation
}

type Query {
  version: String!

  forgotEmailUserPassword(home: String!, email: String!): Ok!
  confirmEmailUser(home: String!, email: String!): Ok!
  unlockEmailUser(home: String!, email: String!): Ok!

  # confirmUserByPhone(phone: String!): Ok!
  # unlockUserByPhone(home: String!, email: String!): Ok!

  getGoogleOauth2Url(home: String!, sessionId: String!): String!

  indexEmailUser(page: Page!): IndexEmailUserResponse!
  indexSmsUser(page: Page!): IndexSmsUserResponse!
  indexGoogleOauth2User(page: Page!): IndexGoogleOauth2UserResponse!
  indexWechatOauth2User(page: Page!): IndexWechatOauth2UserResponse!
  indexWechatMiniProgramUser(page: Page!): IndexWechatMiniProgramUserResponse!
  indexLog(page: Page!): IndexLogResponse!
  # refresh: RefreshResponse!

  indexAttachment(page: Page!): IndexAttachmentResponse!
  showAttachment(id: ID!): Attachment!

  indexLocale(page: Page!): IndexLocaleResponse!
  getLocaleByLang(lang: String!): [Locale!]!

  currencies: [Currency!]!
}

type Mutation {
  signInByEmail(
    email: String!
    password: String!
    ttl: Int!
  ): UserSignInResponse!
  # signInByPhone(phone: String!, password: String!, ttl: Int!): UserSignInResponse!
  signInByGoogleOauth2(
    home: String!
    sessionId: String!
    code: String!
    state: String!
    lang: String!
    timezone: String!
    ttl: Int!
  ): UserSignInResponse!
  # signInByWechatOauth2(token: String!): SignInResponse!
  # signInByWechatMiniProgram(token: String!): SignInResponse!
  # changeEmailUserPassword(currentPassword: String!, newPassword: String!): Ok!
  # resetEmailUserPassword(token: String!, password: String!): Ok!

  # signOut: Ok!
  setEmailUserName(name: String!): Ok!
  setEmailUserAvatar(avatar: String!): Ok!
  changeEmailUserPassword(currentPassword: String!, newPassword: String!): Ok!
  confirmEmailUserByToken(token: String!): Ok!
  setUserLocation(lang: String!, timezone: String!): Ok!

  lockUser(id: ID!, reason: String!): Ok!
  unlockUser(id: ID!, reason: String!): Ok!
  destroyUser(id: ID!, reason: String!): Ok!
  setEmailUserPassword(id: ID!, password: String!, reason: String!): Ok!

  createAttachment(
    title: String!
    contentType: String!
    size: Int!
    public: Boolean!
    expireAfterDays: Int
    ttl: Int!
  ): String!
  setAttachmentUploaded(id: ID!): Ok!
  setAttachmentTitle(id: ID!, title: String!): Ok!
  # associateAttachment(
  #   attachmentId: ID!
  #   resourceType: String!
  #   resourceId: ID
  # ): Ok!
  # dissociateAttachment(
  #   attachmentId: ID!
  #   resourceType: String!
  #   resourceId: ID
  # ): Ok!
  destroyAttachment(id: ID!): Ok!

  # siteSetFavicon(url: String!): Ok!
  # siteSetMaintenanceMode(ok: Boolean!, reason: String!): Ok!
  # siteSetDetails(lang: String!, form: SiteDetailsForm!): Ok!
  # siteSetReCaptcha(siteKey: String!, enable: Boolean!): Ok!
  # siteSetGoogleSiteVerify(siteId: String!, enable: Boolean!): Ok!
  # siteSetBaiduSiteVerify(siteId: String, enable: Boolean!): Ok!
  # siteSetIndexNow(key: String, enable: Boolean): Ok!

  setLocale(lang: String!, code: String!, message: String!): Ok!
  destroyLocale(id: ID!): Ok!
}

type Attachment {
  id: ID!
  title: String!
  bucket: String!
  object: String!
  contentType: String!
  public: Boolean!
  size: Int!
  uploadedAt: Time
  updatedAt: Time!
  resources: [Resource!]!
}
type IndexAttachmentResponse {
  items: [Attachment!]!
  pagination: Pagination!
}
input SiteDetailsForm {
  title: String!
  subhead: String!
  keywords: [String!]!
  description: String!
  copyright: String!
}

type Log {
  id: ID!
  plugin: String!
  ip: String!
  level: Int!
  message: String!
  createdAt: Time!
}
type IndexLogResponse {
  items: [Log!]!
  pagination: Pagination!
}

type Locale {
  id: ID!
  lang: String!
  code: String!
  message: String!
  updatedAt: Time!
}
type IndexLocaleResponse {
  items: [Locale!]!
  pagination: Pagination!
}

type Ok {
  createdAt: Time!
}
input Page {
  index: Int!
  size: Int!
}

type Pagination {
  index: Int!
  size: Int!
  hasPrevious: Boolean!
  hasNext: Boolean!
  pages: Int!
  total: Int!
}
type Resource {
  type: String!
  id: ID
}
type Permission {
  resource: Resource!
  operation: String!
}

type Site {
  favicon: String!
  title: String!
  subhead: String!
  keywords: [String!]!
  description: String!
  copyright: String!
}
type RefreshResponse {
  lang: String!
  timezone: String!
  username: String!
  site: Site!
  roles: [String!]!
  permissions: [Permission!]!
}
type UserSignInResponse {
  token: String!
  # layout: RefreshResponse!
}

type IndexEmailUserResponse {
  items: [EmailUser!]!
  pagination: Pagination!
}
type IndexSmsUserResponse {
  items: [SmsUser!]!
  pagination: Pagination!
}
type IndexGoogleOauth2UserResponse {
  items: [GoogleOauth2User!]!
  pagination: Pagination!
}
type IndexWechatOauth2UserResponse {
  items: [WechatOauth2User!]!
  pagination: Pagination!
}
type IndexWechatMiniProgramUserResponse {
  items: [WechatMiniProgramUser!]!
  pagination: Pagination!
}
type UserDetail {
  id: ID!
  sn: String!
  lang: String!
  timezone: String!
  lockedAt: Time
  signInTotal: Int!
  lastSignInAt: Time
  lastSignInIp: String
  currentSignInAt: Time
  currentSignInIp: String
  updatedAt: Time!
  createdAt: Time!
  deletedAt: Time
}
type EmailUser {
  id: ID!
  user: UserDetail!
  name: String!
  email: String!
  confirmedAt: Time
  updatedAt: Time!
  createdAt: Time!
}
type SmsUser {
  id: ID!
  user: UserDetail!
  name: String!
  phone: String!
  updatedAt: Time!
  createdAt: Time!
  name: String!
  phone: String!
  avatar: String
}
type GoogleOauth2User {
  id: ID!
  user: UserDetail!
  updatedAt: Time!
  createdAt: Time!
  code: String!
  name: String!
  email: String!
  emailVerified: Boolean
  picture: String!
  gender: String!
  link: String!
  locale: String!
}
type WechatOauth2User {
  id: ID!
  user: UserDetail!
  updatedAt: Time!
  createdAt: Time!
  nickname: String!
  sex: Int!
  city: String!
  province: String!
  country: String!
  headImgUrl: String
  lang: String!
}
type WechatMiniProgramUser {
  id: ID!
  user: UserDetail!
  updatedAt: Time!
  createdAt: Time!
  nickname: String
  avatar_url: String
}

type Currency {
  code: String!
  name: String!
  country: String!
  isFund: Boolean
  number: Int!
}
