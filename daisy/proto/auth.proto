syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.auth.v1";
option java_outer_classname = "AuthProto";
option go_package = "./;v2";
option csharp_namespace = "Palm.Plugins.Auth.Grpc";
package palm.auth.v1;

message Log {
  enum Level {
    Debug = 0;
    Info = 1;
    Warning = 2;
    Error = 3;
  }
}

message User {
  enum ProviderType {
    Email = 0;
    Phone = 1;
    GoogleOauth2 = 2;
    WechatOauth2 = 3;
    WechatMiniProgram = 4;
  }
}

message Session {
  User.ProviderType type = 1;
  string sn = 2;
}
