syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.portal.v1";
option java_outer_classname = "PortalProto";
option go_package = "./;v2";
option csharp_namespace = "Palm.Plugins.Portal.Grpc";
package palm.portal.v1;

import "google/protobuf/empty.proto";

message IdRequest {
  uint64 id = 1;
}

message Page {
  uint64 index = 1;
  uint64 size  = 2;
}

message Pagination {
  Page   current      = 1;
  bool   has_previous = 2;
  bool   has_next     = 3;
  uint64 pages        = 4;
  uint64 total        = 5;
}

message Attachment {
  string bucket = 1;
  string object = 2;
}

message RichText {
  enum Editor {
    CK_EDITOR = 0;
  }
  Editor              editor      = 1;
  string              body        = 2;
  repeated Attachment attachments = 3;
}

message Location {
  enum Map {
    GOOGLE = 0;
  }
  Map    map     = 1;
  string address = 2;
}

// ----------------------------------------------------------------------------

service Site {
  rpc Currencies(google.protobuf.Empty) returns (CurrenciesResponse) {}
}

message CurrenciesResponse {
  message Item {
    string          code    = 1;
    string          name    = 2;
    string          country = 3;
    uint32          number  = 4;
    optional uint32 units   = 5;
    optional bool   is_fund = 6;
  }
  repeated Item items = 1;
}

message Log {
  enum Level {
    DEBUG   = 0;
    INFO    = 1;
    WARNING = 2;
    ERROR   = 3;
  }
}

message User {
  enum ProviderType {
    EMAIL               = 0;
    PHONE               = 1;
    GOOGLE_OAUTH2       = 2;
    WECHAT_OAUTH2       = 3;
    WECHAT_MINI_PROGRAM = 4;
  }
}

message Session {
  User.ProviderType type = 1;
  string            sn   = 2;
}

// ----------------------------------------------------------------------------
