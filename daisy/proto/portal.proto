syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.portal.v1";
option java_outer_classname = "PortalProto";
option go_package = "./;v2";
option csharp_namespace = "Palm.Plugins.Portal.Grpc";
package palm.portal.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message IdRequest {
  int64 id = 1;
}

message Page {
  int64 index = 1;
  int64 size  = 2;
}

message Pagination {
  Page  current      = 1;
  bool  has_previous = 2;
  bool  has_next     = 3;
  int64 pages        = 4;
  int64 total        = 5;
}

message Attachment {
  string bucket = 1;
  string object = 2;
}

message RichText {
  enum Editor {
    CK_EDITOR = 0;
  }
  Editor              editor      = 1;
  string              body        = 2;
  repeated Attachment attachments = 3;
}

message Location {
  enum Map {
    GOOGLE = 0;
  }
  Map    map     = 1;
  string address = 2;
}

// ----------------------------------------------------------------------------
service Locale{
  rpc Index(Page) returns (LocaleIndexResponse){}
  rpc Set(LocaleSetRequest) returns (google.protobuf.Empty) {}
  rpc ByLang(LocaleByLangRequest) returns (LocaleByLangResponse) {}
}

message LocaleSetRequest {
  string lang    = 1;
  string code    = 2;
  string message = 3;
}

message LocaleByLangRequest {
  string lang = 1;
}

message LocaleByLangResponse {
  repeated LocaleIndexResponse.Item items = 1;
}

message LocaleIndexResponse{
  message Item {
    int64                     id         = 1;
    string                    lang       = 2;
    string                    code       = 3;
    string                    message    = 4;
    google.protobuf.Timestamp updated_at = 9;
  }
  repeated Item items      = 1;
  Pagination    pagination = 9;
}
// ----------------------------------------------------------------------------

service Site {
  rpc Currencies(google.protobuf.Empty) returns (CurrenciesResponse) {}
}

message CurrenciesResponse {
  message Item {
    string          code    = 1;
    string          name    = 2;
    string          country = 3;
    uint32          number  = 4;
    optional uint32 units   = 5;
    optional bool   is_fund = 6;
  }
  repeated Item items = 1;
}

message Log {
  enum Level {
    DEBUG   = 0;
    INFO    = 1;
    WARNING = 2;
    ERROR   = 3;
  }
}

message User {
  enum ProviderType {
    EMAIL               = 0;
    PHONE               = 1;
    GOOGLE_OAUTH2       = 2;
    WECHAT_OAUTH2       = 3;
    WECHAT_MINI_PROGRAM = 4;
  }
}

message Session {
  User.ProviderType type = 1;
  string            sn   = 2;
}

// ----------------------------------------------------------------------------
