syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.portal.v1";
option java_outer_classname = "PortalProto";
option go_package = "./;v2";
option csharp_namespace = "Palm.Plugins.Portal.Grpc";
package palm.portal.v1;

message Page {
  uint64 index = 1;
  uint64 size = 2;
}
message Pagination {
  Page current = 1;
  bool has_previous = 2;
  bool has_next = 3;
  uint64 pages = 4;
  uint64 total = 5;
}
message Attachment {
  string bucket = 1;
  string object = 2;
}
message RichText {
  enum Editor {
    CKEditor = 0;
  }
  Editor editor = 1;
  string body = 2;
  repeated Attachment attachments = 3;
}

message Location {
  enum Map {
    Google = 0;
  }
  Map map = 1;
  string address = 2;
}

// ----------------------------------------------------------------------------

message Log {
  enum Level {
    Debug = 0;
    Info = 1;
    Warning = 2;
    Error = 3;
  }
}

message User {
  enum ProviderType {
    Email = 0;
    Phone = 1;
    GoogleOauth2 = 2;
    WechatOauth2 = 3;
    WechatMiniProgram = 4;
  }
}

message Session {
  User.ProviderType type = 1;
  string sn = 2;
}
