<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
  <head>
    {% include "bootstrap5/header.html" %}
  </head>
  <body>
    {% include "bootstrap5/nav-bar.html" %}
    <main>
      <div class="container">
        <hr />
        <div class="row">
          <div class="col-md-7 order-md-2">
            <h2 class="fw-normal lh-1">
              {{ ledger.label }}
              <span class="text-body-secondary">{{ ledger.updated_at }}</span>
            </h2>
            <p class="lead">{{ ledger.memo }}</p>
          </div>
          <div class="col-md-5 order-md-1">
            <svg
              class="bd-placeholder-img bd-placeholder-img-lg img-fluid mx-auto"
              width="500"
              height="500"
              xmlns="http://www.w3.org/2000/svg"
              role="img"
              aria-label="Placeholder: 500x500"
              preserveAspectRatio="xMidYMid slice"
              focusable="false"
            >
              <title>Placeholder</title>
              <rect width="100%" height="100%" fill="var(--bs-secondary-bg)" />
              <text x="50%" y="50%" fill="var(--bs-secondary-color)" dy=".3em">
                500x500
              </text>
            </svg>
          </div>
        </div>
        <hr />
      </div>
      {% include "bootstrap5/footer.html" %}
    </main>
  </body>
</html>
