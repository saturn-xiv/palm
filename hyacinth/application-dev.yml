server:
  address: 0.0.0.0
  port: 8180
logging:
  level:
    root: INFO
    "com.github.saturn_xiv.palm": DEBUG
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://127.0.0.1:5432/hyacinth"
    username: www
    password: "change-me"
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: "classpath:/db/postgresql/changelog/master.xml"
hyacinth:
  rpc:
    endpoints:
      phlox:
        host: "127.0.0.1"
        port: 10801
      lavender:
        host: "127.0.0.1"
        port: 10802
      jasmine:
        host: "127.0.0.1"
        port: 10803
