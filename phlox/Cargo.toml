[package]
name = "phlox"
version = "2025.5.23"
edition = "2024"
description = "A total free online education solution."

[dependencies]
env_logger = "0.11"
clap = "4"

[dependencies.chrono]
version = "0.4"
features = ["serde", "std"]

[dependencies.diesel-adapter]
version = "1"
features = ["postgres"]

[dependencies.hyper]
version = "1"
features = ["full"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.uuid]
version = "1"
features = ["v4", "serde"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.casbin]
version = "2"
features = ["watcher"]

[dependencies.diesel]
version = "2"
default-features = false
features = ["postgres", "extras", "huge-tables"]


[dependencies.fig]
path = "../fig"
