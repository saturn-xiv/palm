[package]
name = "phlox"
version = "2026.3.30"
edition = "2024"

[dependencies]
crypto-common = "0.2"
futures-util = "0.3"
mime = "0.3"
log = "0.4"
aead = "0.5"
minio = "0.3"
axum = "0.8"
rabbitmq-stream-client = "0.11"
r2d2 = "0.8"
unic-langid = "0.9"
lettre = "0.11"
sha2 = "0.11"
aes-gcm-siv = "=0.12.0-rc.3"    # FIXME
hmac = "=0.13"
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
askama = "0.15"
fluent = "0.17"
hyper = "1"
regex = "1"
serde_json = "1"
toml = "1"
data-encoding = "2"
opensearch = "2"
tempfile = "3"
lapin = "4"
flexbuffers = "25"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.chrono-tz]
version = "0.10"
features = ["serde"]

[dependencies.rand]
version = "0.10"
features = ["thread_rng"]

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.quick-xml]
version = "0.39"
features = ["serialize"]

[dependencies.redis]
version = "1"
features = ["r2d2", "cluster"]

[dependencies.diesel-adapter]
version = "1"
features = ["postgres"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.uuid]
version = "1"
features = ["v4", "serde"]

[dependencies.casbin]
version = "2"
features = ["watcher"]

[dependencies.diesel]
version = "2"
default-features = false
features = ["r2d2", "postgres", "sqlite", "extras", "huge-tables"] # "mysql",

[dependencies.url]
version = "2"
features = ["serde"]

[dependencies.jsonwebtoken]
version = "10"
features = ["rust_crypto"]

[dependencies.libsqlite3-sys]
version = "*"
features = ["bundled"]

# [dependencies.mysqlclient-sys]
# version = "*"
# features = ["bundled"]

[dependencies.pq-sys]
version = "*"
features = ["bundled"]

[dependencies.openssl-sys]
version = "*"
features = ["vendored"]

[dependencies.twilio]
path = "../twilio"
