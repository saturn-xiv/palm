[package]
name = "phlox"
version = "2026.3.29"
edition = "2024"

[dependencies]
crypto-common = "0.2"
log = "0.4"
aead = "0.5"
minio = "0.3"
axum = "0.8"
rabbitmq-stream-client = "0.11"
r2d2 = "0.8"
sha2 = "0.11"
aes-gcm-siv = "=0.12.0-rc.3"    # FIXME
hmac = "=0.13.0-rc.6"           # FIXME
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
hyper = "1"
data-encoding = "2"
opensearch = "2"
lapin = "4"
flexbuffers = "25"


[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.chrono-tz]
version = "0.10"
features = ["serde"]

[dependencies.rand]
version = "0.10"
features = ["thread_rng"]

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.redis]
version = "1"
features = ["r2d2", "cluster"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.uuid]
version = "1"
features = ["v4", "serde"]

[dependencies.diesel]
version = "2"
default-features = false
features = ["r2d2", "postgres", "sqlite", "extras", "huge-tables"] # "mysql",

[dependencies.jsonwebtoken]
version = "10"
features = ["rust_crypto"]

[dependencies.libsqlite3-sys]
version = "*"
features = ["bundled"]

# [dependencies.mysqlclient-sys]
# version = "*"
# features = ["bundled"]

[dependencies.pq-sys]
version = "*"
features = ["bundled"]

[dependencies.openssl-sys]
version = "*"
features = ["vendored"]
