syntax = "proto3";
package palm.loquat.v1;

import "google/protobuf/empty.proto";

option csharp_namespace = "Palm.Plugins.Loquat.Grpc";
option go_package = "./;v2";
option java_multiple_files = true;
option java_outer_classname = "LoquatProto";
option java_package = "com.github.saturn_xiv.palm.plugins.loquat.v1";

// --------------------------------------------------------
service JwtService {
  rpc Compute(JwtComputeRequest) returns (JwtComputeResponse) {}
  rpc Verify(JwtVerifyRequest) returns (JwtVerifyResponse) {}
}

message JwtVerifyRequest {
  string token = 1;
  string issuer = 2;
  string audience = 3;
}

message JwtVerifyResponse {
  string subject = 1;
  optional bytes payload = 2;
}

message JwtComputeRequest {
  optional string jwt_id = 1;
  optional string key_id = 2;
  string issuer = 3;
  string subject = 4;
  repeated string audiences = 5;
  int64 issued_at = 6;
  int64 not_before = 7;
  int64 expired_at = 8;
  optional bytes payload = 9;
}

message JwtComputeResponse {
  string token = 1;
}

// --------------------------------------------------------
service MacService {
  rpc Compute(MacComputeRequest) returns (MacComputeResponse) {}
  rpc Verify(MacVerifyRequest) returns (google.protobuf.Empty) {}
}

message MacComputeRequest {
  bytes plain = 1;
}

message MacComputeResponse {
  bytes hashed = 1;
}

message MacVerifyRequest {
  bytes hashed = 1;
  bytes plain = 2;
}

// --------------------------------------------------------
service AeadService {
  rpc Encrypt(AeadEncryptRequest) returns (AeadEncryptResponse) {}
  rpc Decrypt(AeadDecryptRequest) returns (AeadDecryptResponse) {}
}

message AeadEncryptRequest {
  bytes plain = 1;
  bytes associated_data = 2;
}

message AeadEncryptResponse {
  bytes cipher = 1;
}

message AeadDecryptRequest {
  bytes cipher = 1;
  bytes associated_data = 2;
}

message AeadDecryptResponse {
  bytes plain = 1;
}

// --------------------------------------------------------
service Argon2Service {
  rpc Compute(Argon2ComputeRequest) returns (Argon2ComputeResponse) {}
  rpc Verify(Argon2VerifyRequest) returns (google.protobuf.Empty) {}
}

message Argon2ComputeRequest {
  string password = 1;
}

message Argon2ComputeResponse {
  string hashed = 1;
}

message Argon2VerifyRequest {
  string hashed = 1;
  string password = 2;
}
// --------------------------------------------------------
