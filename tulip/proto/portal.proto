syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.portal.v1";
option java_outer_classname = "PortalProto";
option go_package = "./;v2";
option csharp_namespace = "Palm.Plugins.Portal.Grpc";
package palm.portal.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ----------------------------------------------------------------------------

message IdRequest {
  int64 id = 1;
}

message Page {
  int64 index = 1;
  int64 size  = 2;
}

message Pagination {
  Page  current      = 1;
  bool  has_previous = 2;
  bool  has_next     = 3;
  int64 pages        = 4;
  int64 total        = 5;
}

message File  {
  string bucket = 1;
  string object = 2;
}

message RichText {
  enum Editor {
    CK_EDITOR = 0;
  }
  Editor        editor      = 1;
  string        body        = 2;
  repeated File attachments = 3;
}

message Location {
  enum Map {
    GOOGLE = 0;
  }
  Map    map     = 1;
  string address = 2;
}

// ----------------------------------------------------------------------------

message EmailTask {
  message Address {
    string name  = 1;
    string email = 2;
  }
  message Body {
    string content = 1;
    bool   html    = 2;
  }
  message Attachment {
    string name    = 1;
    bytes  content = 2;
    bool   inline  = 3;
  }
  Address             to          = 1;
  repeated Address    cc          = 2;
  repeated Address    bcc         = 3;
  string              subject     = 11;
  Body                body        = 12;
  repeated Attachment attachments = 13;
}

message SmsTask {
  string          from = 1;
  repeated string to   = 2;
  string          body = 3;
}

message CupsTask {
  enum Media{
    A4     = 0;
    LETTER = 1;
    A3     = 2;
  }
  enum JobSheet{
    STANDARD     = 0;
    SECRET       = 1;
    TOP_SECRET   = 2;
    CLASSIFIED   = 3;
    CONFIDENTIAL = 4;
    UNCLASSIFIED = 9;
  }
  enum Quality{
    DRAFT  = 0;
    NORMAL = 1;
    BEST   = 2;
  }
  enum Sides{
    ONE       = 0;
    TWO_LONG  = 1;
    TWO_SHORT = 2;
  }
  enum Orientation{
    LANDSCAPE_COUNTER_CLOCKWISE90 = 0;
    LANDSCAPE_CLOCKWISE90         = 1;
    REVERSE_PORTRAIT              = 2;
  }
  string          printer   = 1;
  string          name      = 2;
  repeated uint32 number_up = 7;
  uint32          copies    = 8;
  bytes           document  = 9;

  Media       media       = 11;
  JobSheet    job_sheet   = 12;
  Quality     quality     = 13;
  Sides       sides       = 14;
  Orientation orientation = 15;

}

message TexTask {
  enum Document {
    BOOK    = 0;
    ARTICLE = 1;
    REPORT  = 2;
    LETTER  = 3;
    BEAMER  = 4;
  }
  message Target {
    string bucket = 1;
    string object = 2;
  }
  Document           document = 1;
  string             entry    = 2;
  map<string, bytes> files    = 3;
  Target             target   = 9;
}

// ----------------------------------------------------------------------------

service User {
}

message UserIndexResponse{
  message Item{
    enum Type{
      Email             = 0;
      Sms               = 1;
      GoogleOauth2      = 2;
      WechatOauth2      = 3;
      WechatMiniProgram = 4;
    }
    int64  id   = 1;
    Type   type = 2;
    string sn   = 3;
  }
  repeated Item items      = 1;
  Pagination    pagination = 9;
}

message Session {
  string                    locale     = 1;
  optional string           client_ip  = 2;
  google.protobuf.Timestamp created_at = 99;
}
// ----------------------------------------------------------------------------

service Site {
  rpc HealthCheck(google.protobuf.Empty) returns (SiteHealthCheckResponse) {}
}

message SiteHealthCheckResponse{
  optional string db    = 1;
  optional string cache = 2;
  optional string queue = 3;
  optional string s3    = 4;

  string                    version    = 98;
  google.protobuf.Timestamp created_at = 99;
}
