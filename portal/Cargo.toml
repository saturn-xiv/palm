[package]
name = "portal"
version = "2026.7.21"
edition = "2024"

[dependencies]
log = "0.4"
minio = "0.4"
xmpp = "0.7"
axum = "0.8"
r2d2 = "0.8"
rabbitmq-stream-client = "0.11"
sha2 = "0.11"
askama = "0.16"
hyper = "1"
regex = "1"
serde_json = "1"
toml = "1"
data-encoding = "2"
opensearch = "2"
tempfile = "3"
lapin = "4"
flatbuffers = "25"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.chrono-tz]
version = "0.10"
features = ["serde"]

[dependencies.rand]
version = "0.10"
features = ["thread_rng"]

[dependencies.juniper]
version = "0.17"
features = ["uuid", "url", "chrono", "chrono-tz"]

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.quick-xml]
version = "0.41"
features = ["serialize"]

[dependencies.redis]
version = "1"
features = ["r2d2", "cluster"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.uuid]
version = "1"
features = ["v4", "serde"]

[dependencies.diesel]
version = "2"
default-features = false
features = ["postgres", "r2d2"]

[dependencies.url]
version = "2"
features = ["serde"]

[dependencies.belladonna]
path = "../belladonna"

[dependencies.hyacinth]
path = "../hyacinth"
