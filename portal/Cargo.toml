[package]
name = "portal"
version = "2026.7.21"
edition = "2024"

[dependencies]
flatbuffers = "25"

[dependencies.diesel]
version = "2"
default-features = false
features = [
    "128-column-tables",
    "postgres",
    "chrono",
    "serde_json",
    "uuid",
    "network-address",
    "numeric",
    "r2d2",
]
