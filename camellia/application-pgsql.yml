server:
  address: 0.0.0.0
  port: 8180
logging:
  level:
    root: INFO
    "com.github.saturn_xiv.palm": DEBUG
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://127.0.0.1:5432/camellia"
    username: www
    password: "change-me"
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: "127.0.0.1"
      port: 6379
  liquibase:
    change-log: "classpath:/db/postgresql/change-logs/master.xml"
  graphql:
    graphiql:
      enabled: true
camellia:
  opt-erlang:
    node-name: "javaNode"
    cookie: "secret"
  casbin:
    model: "rbac"
