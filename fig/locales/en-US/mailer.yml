users:
  confirm:
    subject: "Confirmation instructions"
    body: "Welcome {{ recipient }}!<br />You can confirm your account email through the link below:<br/><a href='{{ home }}/my/users/confirm/{{ token }}'>Confirm my account</a>"
  unlock:
    subject: "Unlock instructions"
    body: "Hello {{ recipient }}!<br/>Your account has been locked due to an excessive number of unsuccessful sign in attempts. Click the link below to unlock your account: <a href='{{ home }}/my/users/unlock/{{ token }}'>Unlock my account</a>"
  reset-password:
    subject: "Reset password instructions"
    body: "Hello {{ recipient }}!<br/>Someone has requested a link to change your password. You can do this through the link below.<br/><a href='{{ home }}/my/users/reset-password/{{ token }}'>Change my password</a><br />If you didn't request this, please ignore this email. Your password won't change until you access the link above and create a new one."
  email_changed:
    subject: "Email Changed"
    body: "Hello {{ recipient }}!<br/>We're contacting you to notify you that your email is being changed to {{ email }}."
  password_changed:
    subject: "Password Changed"
    body: "Hello {{ recipient }}!<br/>We're contacting you to notify you that your password has been changed."
