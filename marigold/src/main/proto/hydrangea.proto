syntax = "proto3";
package palm.hydrangea.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Palm.Plugins.Hydrangea.Grpc";
option go_package = "./;v2";
option java_multiple_files = true;
option java_outer_classname = "HydrangeaProto";
option java_package = "com.github.saturn_xiv.palm.plugins.hydrangea.v1";

service StashService {
  rpc Job(StashJobRequest) returns (google.protobuf.Empty) {}
}

message StashJobRequest {
  Task task = 1;
  int32 status_code = 2;
  string stdout = 3;
  string stderr = 4;
  google.protobuf.Timestamp launched_at = 8;
  google.protobuf.Duration elapsed = 9;
}

message Task {
  string sn = 1;
  string name = 2;
  string summary = 3;
  string version = 4;
  string script = 11;
  repeated string args = 12;
}
