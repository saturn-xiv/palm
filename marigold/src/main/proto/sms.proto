syntax = "proto3";
package palm.sms.v1;

option csharp_namespace = "Palm.Plugins.Sms.Grpc";
option go_package = "./;v2";
option java_multiple_files = true;
option java_outer_classname = "SmsProto";
option java_package = "com.github.saturn_xiv.palm.plugins.sms.v1";

message Task {
  repeated string to = 1;
  string body = 2;
  optional string status_callback = 9;
}
