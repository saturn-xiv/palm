syntax = "proto3";
package palm.sms.v1;

option csharp_namespace = "Palm.Plugins.Sms.Grpc";
option go_package = "./;v2";
option java_multiple_files = true;
option java_outer_classname = "SmsProto";
option java_package = "com.github.saturn_xiv.palm.plugins.sms.v1";

message Task {
  enum By{
    TWILIO = 0;
  }
  string from = 1;
  repeated string to = 2;
  string body = 3;
  optional string status_callback = 8;
  By by = 9;
}
