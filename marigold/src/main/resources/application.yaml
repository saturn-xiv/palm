spring:
  application:
    name: Marigold
  mustache:
    prefix: classpath:/templates/
    suffix: .mustache
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  cache:
    type: redis
    redis:
      time-to-live: 604800
      use-key-prefix: true
  task:
    execution:
      thread-name-prefix: "marigold-t-"
  liquibase:
    change-log: classpath:db/change-logs/master.xml
  rabbitmq:
    listener:
      direct:
        prefetch: 1
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
  mail:
    default-encoding: UTF-8
