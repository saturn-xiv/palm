spring:
  application:
    name: Marigold
  mustache:
    prefix: classpath:/templates/
    suffix: .mustache
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  task:
    execution:
      thread-name-prefix: "marigold-t-"
  liquibase:
    change-log: classpath:db/change-logs/master.xml
