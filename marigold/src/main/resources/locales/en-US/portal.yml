layouts:
  anonymous:
    sign-in:
      by-facebook: "Sign in with Facebook"
      by-google: "Sign in with Google"
      by-wechat: "Sign in with Wechat"
    description:
      settings-suggest:
        title: "Settings suggest"
        content: "Content"
      construction:
        title: "Construction"
