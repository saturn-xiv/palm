[package]
name = "marigold"
version = "2026.3.29"
edition = "2024"
description = "A total free online education solution."
homepage = "https://github.com/saturn-xiv/palm"

[dependencies]
log = "0.4"
axum = "0.8"
env_logger = "0.11"
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tonic-types = "0.14"
hyper = "1"

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.nix]
version = "0.31"
features = ["user"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.diesel]
version = "2"
default-features = false

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.phlox]
path = "../phlox"

[build-dependencies]
tonic-prost-build = "0.14"
