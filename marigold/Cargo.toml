[package]
name = "marigold"
version = "2026.1.18"
edition = "2024"
description = "A total free online education solution."

[dependencies]
log = "0.4"
axum = "0.8"
env_logger = "0.11"
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tonic-types = "0.14"
hyper = "1"
clap = "4"


[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.nix]
version = "0.31"
features = ["user"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.diesel]
version = "2"
default-features = false
features = ["postgres", "sqlite", "extras", "huge-tables"] # "mysql",

[dependencies.libsqlite3-sys]
version = "*"
features = ["bundled"]

# [dependencies.mysqlclient-sys]
# version = "*"
# features = ["bundled"]

[dependencies.pq-sys]
version = "*"
features = ["bundled"]

[dependencies.openssl-sys]
version = "*"
features = ["vendored"]

[dependencies.phlox]
path = "../phlox"


[build-dependencies]
tonic-prost-build = "0.14"
