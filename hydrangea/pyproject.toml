[project]
name = "hydrangea"
authors = [{ name = "Jeremy Zheng", email = "jitang.zheng@gmail.com" }]
description = "Aggregating your logs, tracking the health, uptime, and performance of your hardware and networks"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "protobuf~=7.34",
    "grpcio~=1.82",
    "grpcio-reflection",
    "grpcio-health-checking",
    "psycopg[c,pool]",
    "mysql-connector-python",
    "redis[hiredis]",
    "pika",
    "opensearch-py",
    "systemd-python",
    "kubernetes",
    "requests",
    "pysnmp",
    "psutil",
    "numpy",
    "fcgi-client",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/saturn-xiv/palm/tree/main/hydrangea"
Issues = "https://github.com/saturn-xiv/palm/issues"

[project.scripts]
hydrangea = "hydrangea:main"

[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrangea"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."
version_scheme = "no-guess-dev"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "tmp"]
venvPath = "."
venv = "tmp/python"
pythonVersion = "3.14"
typeCheckingMode = "basic"
