syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.portal.v1";
option java_outer_classname = "PortalProto";
option go_package = "./;v2";
option csharp_namespace = "Palm.Plugins.Portal.Grpc";
package palm.portal.v1;

message PasswordRequest {
  string plain = 1;
  double salt = 2;
}
message UserIndexResponse {
  message Item{
    enum Type{
      EMAIL = 0;
      SMS = 1;
      GOOGLE_OAUTH2 = 11;
      WECHAT_OAUTH2 = 12;
      WECHAT_MINI_PROGRAM = 13;
    }
    string sn = 1;
    Type type = 2;
  }
  repeated Item items = 1;
}


message UserToken {
  enum Audience {
    SIGN_IN = 0;
    HYDRANGEA_JOB = 1;    
  }
  message Payload {
    UserIndexResponse.Item.Type type = 1;  
  }  
}

message SmsTask {
  repeated string to =1;
  string body = 2;
  optional string status_callback = 9;
}

message TexTask {
  enum Class {
    Article = 0;
    Report = 1;
    Book = 2;
    Letter = 3;
    Beamer = 4;
  }
    
  string entry = 1;
  Class class = 2;
  map<string, bytes> files = 3;
  string output = 4;
}

message EmailTask {
  message Address {
    optional string name = 1;
    string email = 2;
  }
  message Body {
    bool html = 1;
    string content = 2;
  }
  message Attachment {
    optional string inline_id = 1;
    string name = 2;
    string content_type = 3;
    bytes content = 9;
  }
  
  Address to = 1;
  optional Address reply_to = 2;
  repeated Address cc = 3;
  repeated Address bcc = 4;
  string subject = 11;
  Body body = 12;
  repeated Attachment attachments = 19;
}

message CupsTask {
  enum JobSheet {
    Standard = 0;
    Unclassified = 1;
    Classified = 2;
    Confidential = 3;
    Secret = 4;
    TopSecret = 5;
  }
  enum Media {
    A4 = 0;
    A3 = 2;
    Letter = 3;
  } 
  enum Orientation {
    LandscapeCounterClockwise90 = 0;
    LandscapeClockwise90 = 1;
    ReversePortrait = 2;
  }
  enum Quality {
    Draft = 0;
    Normal = 1;
    Best = 2;
  }
  enum Sides {
    One = 0;
    TwoLong = 1;
    TwoShort = 2;
  }

  string name = 1;
  bytes document = 2;
  uint32 number_up = 8;
  uint32 copies = 9;    
  JobSheet job_sheet = 11;
  Media media = 12;
  Orientation orientation = 13;
  Quality quality = 14;
  Sides sides = 15;
}

