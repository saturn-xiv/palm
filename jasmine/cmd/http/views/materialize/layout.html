{{ define "materialize.layouts.base" }}
{{/* https://materializeweb.com/getting-started.html */}}
<!DOCTYPE html>
<html lang="{{ .locale }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    {{/* https://developers.google.com/fonts/docs/material_icons#setup_method_2_self_hosting */}}
    <link href="/static/assets/material-icons.css" rel="stylesheet"/>
    <link type="text/css" rel="stylesheet" href="/static/assets/vendors/materialize-2.2.2/css/materialize.min.css" media="screen,projection"/>
    <script type="text/javascript" src="/static/assets/vendors/materialize-2.2.2/js/materialize.min.js"></script>
    {{ block "header" . }}{{ end }}
  </head>
  <body>    
    {{ block "content" . }}{{ end }}
  </body>
</html>

{{ end }}
