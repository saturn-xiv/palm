syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.s3.v1";
option go_package = "./;v2";
package palm.s3.v1;

service S3 {
  rpc Upload(S3UploadRequest) returns (S3UploadResponse) {}
}

message S3UploadRequest {
  string name = 1;
  string content_type = 2;
  bytes content = 8;
  string bucket = 9;
}

message S3UploadResponse {
  string bucket = 1;
  string object = 2;
}
