syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.wiki.v1";
option go_package = "./;v2";
package palm.wiki.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

import "portal.proto";

service Article {
  rpc Save(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc ShowByTitle(ArticleShowByTitleRequest)
      returns (ArticleShowByTitleResponse) {}
  rpc Index(palm.portal.v1.Page) returns (ArticleIndexResponse) {}
  rpc History(palm.portal.v1.Page) returns (ArticleHistoryResponse) {}
}

message ArticleSaveRequest {
  string slug = 1;
  string lang = 2;
  string title = 3;
  string body = 4;
  repeated string categories = 9;
}
message ArticleShowByTitleRequest {
  string title = 1;
}
message ArticleShowByTitleResponse {
  ArticleIndexResponse.Item item = 1;
  repeated ArticleHistoryResponse.Item histories = 2;
  repeated ArticleHistoryResponse.Item related = 3;
}

message ArticleIndexResponse {
  message Item {
    string slug = 1;
    string lang = 2;
    string title = 3;
    string body = 4;
    repeated string categories = 9;
    palm.portal.v1.UserDetails user = 91;
    uint32 version = 97;
    google.protobuf.Timestamp updated_at = 98;
    google.protobuf.Timestamp created_at = 99;
  }
  repeated Item items = 1;
  palm.portal.v1.Pagination pagination = 9;
}

message ArticleHistoryResponse {
  message Item {
    string title = 1;
    string summary = 2;
    palm.portal.v1.UserDetails user = 7;
    uint32 version = 8;
    google.protobuf.Timestamp updated_at = 9;
  }
  repeated Item items = 1;
  palm.portal.v1.Pagination pagination = 9;
}

