syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.github.saturn_xiv.palm.plugins.tex.v1";
option go_package = "./;v2";
package palm.tex.v1;

message TexToPdfTask {
  enum Type {
    Document = 0;
    SlideShow = 1;
  }
  Type type = 1;
  string entry = 2;
  map<string, bytes> files = 9;
  string target_upload_url = 11;
  optional string report_callback_url = 12;
}
