// ----------------------------------------------------------------------------

service Administrator {
  rpc SignIn(AdministratorSignInRequest) returns (AdministratorSignInResponse) {
  }
  rpc SignOut(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc Update(AdministratorUpdateRequest) returns (google.protobuf.Empty) {}
}

message AdministratorSignInRequest {
  AdministratorUpdateRequest.Item user = 1;
  google.protobuf.Duration ttl = 9;
}

message AdministratorSignInResponse {
  string token = 1;
  string locale = 11;
  string timezone = 12;
  repeated string languages = 19;
}

message AdministratorUpdateRequest {
  message Item {
    string name = 1;
    string password = 2;
  }
  Item current = 1;
  Item new = 2;
}

