service Router {
  rpc SetEthernet(RouterIndexEthernetResponse.Item)
      returns (google.protobuf.Empty) {}
  rpc IndexEthernet(google.protobuf.Empty)
      returns (RouterIndexEthernetResponse) {}
  rpc Reboot(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc Apply(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc FactoryReset(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

enum Region {
  Global = 0;
  China = 1;
}

message RouterIndexEthernetResponse {
  message Item {
    message Wan {
      message Static {
        string address = 1;
        string netmask = 2;
        string gateway = 3;
        repeated string dns = 9;
      }
      oneof ip {
        Static static = 1;
        google.protobuf.Empty dhcp = 2;
      }
    }
    message Lan {
      string address = 1;
      string netmask = 2;
      Region region = 9;
    }
    string device = 1;
    string mac = 2;
    string name = 3;
    oneof ethernet {
      Wan wan = 11;
      Lan lan = 12;
      google.protobuf.Empty empty = 19;
    }
    string description = 98;
    bool enable = 99;
  }
  repeated Item items = 1;
}

// ----------------------------------------------------------------------------

service User {
  rpc Index(google.protobuf.Empty) returns (UserIndexResponse) {}
  rpc Create(UserCreateRequest) returns (google.protobuf.Empty) {}
  rpc SetRealName(UserSetRealNameRequest) returns (google.protobuf.Empty) {}
  rpc SetContact(UserSetContactRequest) returns (google.protobuf.Empty) {}
  rpc SetWifi(UserSetWifiRequest) returns (google.protobuf.Empty) {}
}
message UserSetRealNameRequest {
  uint32 id = 1;
  string real_name = 2;
}
message UserSetWifiRequest {
  uint32 id = 1;
  UserIndexResponse.Item.Wifi wifi = 2;
}
message UserSetDetailsRequest {
  uint32 id = 1;
  string real_name = 2;
  UserIndexResponse.Item.Wifi wifi = 3;
}
message UserSetContactRequest {
  uint32 id = 1;
  UserIndexResponse.Item.Contact contact = 2;
}
message UserCreateRequest {
  string real_name = 1;
  UserIndexResponse.Item.Wifi wifi = 2;
}
message UserIndexResponse {
  message Item {
    message Wifi {
      string nickname = 1;
      string password = 2;
      google.protobuf.Timestamp begin_at = 3;
      google.protobuf.Timestamp end_at = 4;
    }
    message Contact {
      optional string wechat = 1;
      optional string address = 2;
      optional string phone = 3;
      optional string email = 4;
    }
    uint32 id = 1;
    string real_name = 2;
    Wifi wifi = 3;
    Contact contact = 9;
  }
  repeated Item items = 1;
}

// ----------------------------------------------------------------------------

service Host {
  rpc Index(google.protobuf.Empty) returns (HostIndexResponse) {}
  rpc SetDescription(HostSetDescriptionRequest)
      returns (google.protobuf.Empty) {}
  rpc Enable(palm.portal.v1.ByIdRequest) returns (google.protobuf.Empty) {}
  rpc Disable(palm.portal.v1.ByIdRequest) returns (google.protobuf.Empty) {}
  rpc Block(HostBlockRequest) returns (google.protobuf.Empty) {}
  rpc SetStaticIpAddress(HostSetStaticIpAddressRequest)
      returns (google.protobuf.Empty) {}
  rpc SetDhcpAddress(HostSetDhcpAddressRequest)
      returns (google.protobuf.Empty) {}
}
message HostIndexResponse {
  message Item {
    uint32 id = 1;
    string name = 2;
    string ip = 3;
    string mac = 4;
    string vendor = 5;
    bool fixed = 6;
    string description = 7;
    optional google.protobuf.Timestamp deleted_at = 8;
    google.protobuf.Timestamp updated_at = 9;
  }
  repeated Item items = 1;
}
message HostSetDescriptionRequest {
  uint32 id = 1;
  string description = 2;
}
message HostBlockRequest {
  enum Weekday {
    Sun = 0;
    Mon = 1;
    Tue = 2;
    Wed = 3;
    Thu = 4;
    Fri = 5;
    Sat = 6;
  }
  message Time {
    uint32 hour = 1;
    uint32 minute = 2;
  }

  uint32 id = 1;
  Time begin = 7;
  Time end = 8;
  repeated Weekday days = 9;
}
message HostSetStaticIpAddressRequest {
  uint32 id = 1;
  string ip = 2;
}
message HostSetDhcpAddressRequest {
  uint32 id = 1;
}
