message Wan {
  message Nat {}

  message Static {
    string address = 11;
    string netmask = 12;
    string gateway = 13;
    uint32 cidr = 19;
    repeated string dns = 14;
  }

  string name = 1;
  oneof ip {
    Static static = 2;
    google.protobuf.Empty dhcp = 3;
  }
  uint32 weight = 98;
  string description = 99;
}
message Lan {
  message Dhcp {
    message Host {
      // -.a-zA-Z0-9
      string name = 1;
      string mac = 2;
    }
    string begin = 1;
    string end = 2;
    repeated string dns = 3;
    map<string, Host> reserved_hosts = 9;
  }
  string name = 1;
  bool blacklist_mode = 9;
  string address = 11;
  string netmask = 12;
  uint32 cidr = 13;
  string network = 14;
  optional Dhcp dhcp = 19;
  string description = 99;
}

message Network {
  message Item {
    oneof interface {
      Wan wan = 1;
      Lan lan = 2;
    }
  }
  map<string, Item> items = 1;
}

